name: core
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run check:types --prefix web
      - run: npm run build --prefix web
      - run: go vet ./...
        working-directory: core
      - run: python3 scripts/test-evaluation.py
      - run: python3 scripts/test-integration.py
      - run: go run ./cmd/renalsafe-openapi > /tmp/renalsafe-openapi.json && diff ../api/openapi.json /tmp/renalsafe-openapi.json
        working-directory: core
