name: core
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - name: Install Poppler
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends poppler-utils
          pdftotext -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run check:types --prefix web
      - run: npm run build --prefix web
      - run: go vet ./...
        working-directory: core
      - run: python3 scripts/test-evaluation.py
      - run: python3 scripts/test-recovery.py
      - run: python3 scripts/test-integration.py
      - run: go run ./cmd/renalsafe-openapi > /tmp/renalsafe-openapi.json && diff ../api/openapi.json /tmp/renalsafe-openapi.json
        working-directory: core
      - run: python3 scripts/bootstrap-local.py
      - run: docker compose build core
      - run: python3 scripts/check-installation.py
