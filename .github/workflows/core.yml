name: core
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: go vet ./...
        working-directory: core
      - run: python3 scripts/test-evaluation.py
      - run: node --check core/internal/httpapi/web/app.js
      - run: node --check core/internal/httpapi/web/patients.js
      - run: python3 scripts/test-integration.py
      - run: go run ./cmd/renalsafe-openapi > /tmp/renalsafe-openapi.json && diff ../api/openapi.json /tmp/renalsafe-openapi.json
        working-directory: core
