name: renalsafe
services:
  db:
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    environment:
      POSTGRES_USER: renalsafe
      POSTGRES_PASSWORD: ${RENALSAFE_DB_PASSWORD:?Run scripts/bootstrap-local.py first}
      POSTGRES_DB: renalsafe
    ports:
      - "127.0.0.1:${RENALSAFE_DB_PORT:-55432}:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U renalsafe -d renalsafe"]
      interval: 3s
      timeout: 3s
      retries: 20
  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    environment:
      RENALSAFE_DATABASE_URL: postgres://renalsafe:${RENALSAFE_DB_PASSWORD}@db:5432/renalsafe?sslmode=disable
      RENALSAFE_OLLAMA_URL: ${RENALSAFE_OLLAMA_URL:-}
      RENALSAFE_EMBEDDING_MODEL: ${RENALSAFE_EMBEDDING_MODEL:-}
    ports:
      - "127.0.0.1:${RENALSAFE_HTTP_PORT:-8080}:8080"
    volumes:
      - ./.local/users.json:/run/renalsafe-users.json:ro
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  database:
